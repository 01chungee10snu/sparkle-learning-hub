<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">마법 마을 v1 학습·게임·보상 아키텍처</title>
<desc id="desc">Unity 마을과 3가지 게임 UI가 JavaScript 호스트에 연결되고, IRT 문항 선택·Progress 채점·Rewards 별 원장이 분리되어 관리됩니다.</desc>
<defs>
  <linearGradient id="night" x2="1" y2="1"><stop stop-color="#1e244e"/><stop offset="1" stop-color="#51377d"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f5ebff"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#8e65b5"/></marker>
  <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#161835" flood-opacity=".35"/></filter>
  <style>
    .title{font-family:sans-serif;font-size:32px;font-weight:900;fill:#fff5d2}
    .box{fill:url(#card);stroke:#bea6d1;stroke-width:3;rx:18;filter:url(#shadow)}
    .name{font:700 21px sans-serif;fill:#372b64}
    .sub{font:500 15px sans-serif;fill:#625c77}
    .edge{fill:none;stroke:#8e65b5;stroke-width:4;marker-end:url(#arrow)}
    .label{font:700 17px sans-serif;fill:#fff6cf}
  </style>
</defs>
<rect width="1200" height="680" fill="url(#night)"/>
<circle cx="1085" cy="80" r="52" fill="#e8d0ff" opacity=".12"/><circle cx="165" cy="520" r="110" fill="#fff7d3" opacity=".06"/>
<text x="55" y="64" class="title">✨ MAGIC VILLAGE PATCH v1 — 게임과 학습의 경계</text>
<rect x="55" y="120" width="345" height="152" class="box"/>
<text x="80" y="160" class="name">🎮 Unity WebGL · 마법마을</text>
<text x="80" y="194" class="sub">8방향 상태 · NPC · 외형 · 이동</text>
<text x="80" y="223" class="sub">학습 채점·별 쓰기 권한 없음</text>
<rect x="460" y="120" width="345" height="152" class="box"/>
<text x="485" y="160" class="name">📖 3종 게임 UI · HTML</text>
<text x="485" y="194" class="sub">마법책 · NPC 의뢰서 · 수정판</text>
<text x="485" y="223" class="sub">입력 접근성 · 원본 이미지 보전</text>
<rect x="855" y="120" width="290" height="152" class="box"/>
<text x="880" y="160" class="name">🔐 Browser Host</text>
<text x="880" y="194" class="sub">요청ID / 권한 검증</text>
<text x="880" y="223" class="sub">실패/중복 방지</text>
<path class="edge" d="M400 190H457"/><path class="edge" d="M805 190H852"/>
<rect x="165" y="330" width="274" height="173" class="box"/>
<text x="190" y="370" class="name">📈 IRT · 추천</text>
<text x="190" y="405" class="sub">4153개 색인 · 첫 독립응답</text>
<text x="190" y="433" class="sub">MAP θ / 불확실성 / 난도</text>
<text x="190" y="461" class="sub">학년 자동 진급 금지</text>
<rect x="475" y="330" width="274" height="173" class="box"/>
<text x="500" y="370" class="name">🧩 Progress · 채점</text>
<text x="500" y="405" class="sub">문항ID · 3/5문항 적응</text>
<text x="500" y="433" class="sub">경시 1~25번 고정</text>
<text x="500" y="461" class="sub">정답·해설·완주 기록</text>
<rect x="785" y="330" width="274" height="173" class="box"/>
<text x="810" y="370" class="name">⭐ Rewards · 별 원장</text>
<text x="810" y="405" class="sub">문항별 별 · 완주 1회 보너스</text>
<text x="810" y="433" class="sub">41종 구매·장착 영수증</text>
<text x="810" y="461" class="sub">형제별 격리 · 중복 방지</text>
<path class="edge" d="M1000 272V295H920V325"/>
<path class="edge" d="M1000 295H610V325"/>
<path class="edge" d="M1000 295H300V325"/>
<path class="edge" d="M746 418H782"/>
<rect x="270" y="550" width="665" height="88" rx="22" fill="#fff1cd" stroke="#e7bb69" stroke-width="3"/>
<text x="304" y="587" class="name">🌷 Village State · 꽃/공용광장</text>
<text x="304" y="612" class="sub">별과 독립된 완료 기록; 개인/가족 누적 꽃의 근거는 검증된 완료 회차</text>
<path class="edge" d="M612 503V546"/>
<text x="80" y="666" class="label">근거 없는 자동 진급 · 중복 보상 · 권리 없는 공개 배포는 하지 않음</text>
</svg>