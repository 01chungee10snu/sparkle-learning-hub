<title>태희·세희의 마법마을 · 배움과 돌봄</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#e8f0e8;color:#263551}
#page{display:flex;flex-direction:column;height:100dvh;min-height:400px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:relative;flex:1;min-height:0}#canvas{display:none;width:100%;height:100%;touch-action:none;background:#bcd8d7;outline:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;padding:22px}
#loading[hidden], [hidden]{display:none!important}
.panel{background:#fffcf7;max-width:460px;width:100%;border-radius:24px;border:2px solid #ddd2e9;padding:26px;box-shadow:0 14px 40px #546a7540;text-align:center}
h1{margin:0 0 14px;font-size:26px}p{line-height:1.65}small{color:#6f7587}
button{font:inherit;background:#7753ab;color:white;border:0;padding:14px 20px;border-radius:14px;font-weight:700;cursor:pointer;min-height:50px}
button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:4px solid #dcb9fc;outline-offset:3px}
#meter{width:100%;height:12px;background:#ebebf0;border-radius:20px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#8663c2;transition:width .25s}
#learner-choices{display:flex;gap:9px;justify-content:center;margin:14px 0}
#learner-choices button{background:#fff;border:2px solid #d2bedf;color:#594077;font-size:17px;min-height:45px;min-width:105px;padding:8px 16px}
#learner-choices button[aria-pressed=true]{background:#ede4fb;border-color:#7856b1;color:#483071;box-shadow:0 0 0 2px #fff inset}
#learner-choices button:focus-visible{outline:3px solid #af79d0}
@media(max-width:420px){#learner-choices button{min-width:90px}}
</style>

<body>
<div id="page">
  <main id="game">
    <div id="lite-village-scene" hidden aria-label="가벼운 2D 마법마을 배경">
      <picture><source media="(orientation:portrait)" srcset="./assets/artcraft-v12/illustration-lite-portrait.png">
      <img src="./assets/artcraft-v12/illustration-welcome.png" width="1200" height="520" alt="" decoding="async"></picture>
      <p>🧚 아래 배움 메뉴에서 모험을 시작해요.</p>
    </div>
    <canvas id="canvas" tabindex="0" aria-label="마법마을 3D 게임"></canvas>
    <div id="village-ui" hidden></div>
    <section id="loading" aria-live="polite">
      <div class="panel">
        <h1>✨ 태희·세희의 마법마을</h1>
        <img class="vh-welcome-art" src="./assets/artcraft-v12/illustration-welcome.png" alt="분홍 태희 요정과 연보라 세희 요정이 꽃나무와 마법학교 사이에서 환영해요." width="1200" height="520" decoding="async">
        <p>오늘은 무엇을 키워 볼까요?<br>씨앗을 심고, 물고기와 동물 친구를 돌봐요.</p>
        <div id="learner-choices" role="group" aria-label="마법마을에 들어갈 어린이"><button type="button" data-learner="tae" aria-pressed="true">🌸 태희</button><button type="button" data-learner="se" aria-pressed="false">🌙 세희</button></div>
        <p id="status">태희·세희의 새 마법마을을 준비하고 있어요.</p>
        <div id="meter" hidden role="progressbar" aria-label="마법마을 준비" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
        <button id="start">✨ 3D 마법마을 입장하기</button>
        <button id="lite" type="button">🌷 가벼운 2D 마을로 시작하기</button>
        <p class="vh-storage-note"><small>기록은 이 기기에 저장돼요. 배움 기록은 학습기록 메뉴에서 옮길 수 있어요. 텃밭·연못·동물 집 기록은 아직 다른 기기로 옮겨지지 않아요.</small></p>
        <a class="vh-entry-record-link" href="../learning.html?view=workbooks">📚 기존 학습기록·문제집 열기</a>
      </div>
    </section>
  </main>
</div>
