<title>태희·세희의 통합 마법마을 · 수학·국어·영어·경시</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#e8f0e8;color:#263551}
#page{display:flex;flex-direction:column;height:100dvh;min-height:400px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{height:57px;flex:none;display:flex;gap:16px;align-items:center;justify-content:space-between;background:#fff; padding:0 14px;box-shadow:0 2px 10px #5c729024;z-index:2}
header strong{font-size:17px}header a{display:inline-block;border:2px solid #8069b2;border-radius:12px;padding:8px 13px;color:#463373;text-decoration:none;font-weight:700}
#game{position:relative;flex:1;min-height:0}#canvas{display:none;width:100%;height:100%;touch-action:none;background:#bcd8d7;outline:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;padding:22px}
#loading[hidden], [hidden]{display:none!important}
.panel{background:#fffcf7;max-width:460px;width:100%;border-radius:24px;border:2px solid #ddd2e9;padding:26px;box-shadow:0 14px 40px #546a7540;text-align:center}
h1{margin:0 0 14px;font-size:26px}p{line-height:1.65}small{color:#6f7587}
button{font:inherit;background:#7753ab;color:white;border:0;padding:14px 20px;border-radius:14px;font-weight:700;cursor:pointer;min-height:50px}
button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:4px solid #dcb9fc;outline-offset:3px}
#meter{width:100%;height:12px;background:#ebebf0;border-radius:20px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#8663c2;transition:width .25s}
@media (max-width:420px){header strong{font-size:15px}header a{font-size:13px;padding:8px}}
#learner-choices{display:flex;gap:9px;justify-content:center;margin:14px 0}
#learner-choices button{background:#fff;border:2px solid #d2bedf;color:#594077;font-size:17px;min-height:45px;min-width:105px;padding:8px 16px}
#learner-choices button[aria-pressed=true]{background:#ede4fb;border-color:#7856b1;color:#483071;box-shadow:0 0 0 2px #fff inset}
#learner-choices button:focus-visible{outline:3px solid #af79d0}
@media(max-width:420px){header{gap:7px;padding:0 9px}header a{font-size:12px;padding:6px 7px}#learner-choices button{min-width:90px}}
</style>
<link rel="stylesheet" href="./village-ui.css?v=unified-20261013">
<link rel="stylesheet" href="./major-patch.css?v=unified-20261013">
<link rel="stylesheet" href="./unified-world.css?v=unified-20261013">
</head>
<body>
<div id="page">
  <header>
    <strong>🧚 태희·세희의 마법마을</strong>
    <a href="../learning.html?view=workbooks">📚 상세 문제집·학습기록</a>
  </header>
  <main id="game">
    <canvas id="canvas" tabindex="0" aria-label="마법마을 3D 게임"></canvas>
    <div id="village-ui" hidden></div>
    <section id="loading" aria-live="polite">
      <div class="panel">
        <h1>✨ 태희·세희의 마법마을</h1>
        <p>이야기 도서관·수학 정원·영어 숲·경시대회 성을 누비며 하나의 세계에서 배워요. 정원과 별 상점도 함께해요.</p>
        <div id="learner-choices" role="group" aria-label="마법마을에 들어갈 어린이"><button type="button" data-learner="tae" aria-pressed="true">🌸 태희</button><button type="button" data-learner="se" aria-pressed="false">🌙 세희</button></div>
        <p id="status">태희·세희의 새 마법마을을 준비하고 있어요.</p>
        <div id="meter" hidden><div id="bar"></div></div>
        <button id="start">마법마을 입장하기</button>
        <p><small>이미 모은 별·학습 기록은 지켜집니다. 이전 개별 공개판의 지갑은 삭제하거나 임의로 합치지 않습니다.</small></p>
      </div>
    </section>
  </main>
</div>
<script type="importmap">{"imports":{"../platform/progress.js":"../platform/progress.js?v=unified-20261013","../platform/rewards.js":"../platform/rewards.js?v=unified-20261013","../platform/growth.js":"../platform/growth.js?v=unified-20261013","../platform/settings.js":"../platform/settings.js?v=unified-20261013","../platform/activities.js":"../platform/activities.js?v=unified-20261013","../platform/activity-ui.js":"../platform/activity-ui.js?v=unified-20261013","../platform/catalog.js":"../platform/catalog.js?v=unified-20261013","../platform/irt.js":"../platform/irt.js?v=unified-20261013","../platform/legacy.js":"../platform/legacy.js?v=unified-20261013","../platform/reward-catalog.js":"../platform/reward-catalog.js?v=unified-20261013","../platform/village-adaptive.js":"../platform/village-adaptive.js?v=unified-20261013","../platform/motion.js":"../platform/motion.js?v=unified-20261013","./garden-state.js":"./garden-state.js?v=unified-20261013","./village-state.js":"./village-state.js?v=unified-20261013"}}</script>
<script type="module">
import { createVillageHost } from './village-bridge.js?v=unified-20261013';
import * as Progress from '../platform/progress.js';
import { createVillageUI } from './village-ui.js?v=unified-20261013';

const status = document.querySelector('#status');
const overlay = document.querySelector('#loading');
const canvas = document.querySelector('#canvas');
const start = document.querySelector('#start');
for(const control of document.querySelectorAll('[data-learner]')){
 control.addEventListener('click',()=>{
   if(start.disabled)return;
   Progress.selectLearner(control.dataset.learner);
   document.querySelectorAll('[data-learner]').forEach(button=>
     button.setAttribute('aria-pressed',String(button===control)));
 });
 control.setAttribute('aria-pressed',String(control.dataset.learner===Progress.learner()));
}
const meter = document.querySelector('#meter');
const bar = document.querySelector('#bar');
let instance = null;
const queued = [];
let queuedCosmetics = null;
let queuedGarden = null;
const uiRoot = document.querySelector('#village-ui');
const ui = createVillageUI({
  root:uiRoot,
  sendToUnity: command => instance?.SendMessage('VillageRuntime','OnUiCommand',command),
  sendRequest: request => host.handle(JSON.stringify(request))
});
const deliver = message => {
  ui.update(message);
  if(message?.ok && message.cosmetics){
    const wear=JSON.stringify(message.cosmetics);
    if(instance)instance.SendMessage('VillageRuntime','OnCosmeticsMessage',wear);
    else queuedCosmetics=wear;
  }
  const payload = JSON.stringify(message);
  if (!instance) queued.push(payload);
  else instance.SendMessage('VillageRuntime', 'OnBridgeMessage', payload);
  if(message?.ok && message.garden) {
    const garden=JSON.stringify(message.garden);
    if(instance)instance.SendMessage('VillageRuntime','OnGardenMessage',garden);
    else queuedGarden=garden;
  }

};
const host = createVillageHost(deliver);
window.SparkleVillageBridge = {handle: raw => host.handle(raw)};

async function discoverBuild() {
  for (const name of ['WebGL', 'sparkle-fairy-village']) {
    const loaderUrl = './Build/' + name + '.loader.js?v=unified-20261013';
    try {
      const result = await fetch(loaderUrl, {method:'HEAD', cache:'no-store'});
      if (result.ok) return {name, loaderUrl};
    } catch { /* other filename or not built yet */ }
  }
  return null;
}
function script(url) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = resolve;
    el.onerror = () => reject(new Error('Unity 로더를 불러오지 못했어요.'));
    document.head.appendChild(el);
  });
}
start.addEventListener('click', async () => {
  start.disabled = true;
  try {
    status.textContent = '기존 학습 기록을 확인하는 중이에요.';
    await host.prepare();
    const build = await discoverBuild();
    if (!build) {
      status.textContent = '3D 웹 빌드를 불러오지 못했어요. 위 학습기록 링크를 통해 문제집을 사용할 수 있어요.';
      start.disabled = false;
      return;
    }
      status.textContent = '마법마을과 여러 학습 지역을 불러오는 중이에요.';
    meter.hidden = false;
    await script(build.loaderUrl);
    if (typeof createUnityInstance !== 'function')
      throw new Error('Unity 실행 모듈을 찾지 못했어요.');
    const base = './Build/' + build.name;
    const compressed = await fetch(base + '.data.unityweb',{method:'HEAD'}).then(r=>r.ok).catch(()=>false);
    const suffix=compressed ? '.unityweb' : '';
    canvas.style.display = 'block';
    instance = await createUnityInstance(canvas, {
      dataUrl: base + '.data' + suffix + '?v=unified-20261013',
      frameworkUrl: base + '.framework.js' + suffix + '?v=unified-20261013',
      codeUrl: base + '.wasm' + suffix + '?v=unified-20261013',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Family Learning',
      productName: 'Sparkle Fairy Village',
      productVersion: '0.8.0-unified'
    }, progress => {
      bar.style.width = Math.round(progress * 100) + '%';
      status.textContent = '마법마을 로딩 ' + Math.round(progress * 100) + '%';
    });
    for (const payload of queued.splice(0))
      instance.SendMessage('VillageRuntime', 'OnBridgeMessage', payload);
    if(queuedCosmetics){
      instance.SendMessage('VillageRuntime','OnCosmeticsMessage',queuedCosmetics);
      queuedCosmetics=null;
    }
    if(queuedGarden){instance.SendMessage('VillageRuntime','OnGardenMessage',queuedGarden);queuedGarden=null;}
    overlay.hidden = true;
    uiRoot.hidden = false;
  } catch (error) {
    canvas.style.display = 'none';
    start.disabled = false;
    status.textContent = '3D 마을을 시작하지 못했어요. ' + (error?.message || '');
    console.error('[Village]', error);
  }
});
</script>
</body>
